<!-- Desktop Sidebar (hidden below md) -->
<aside class="hidden md:flex md:flex-col md:w-56 lg:w-64 md:fixed md:inset-y-0 sidebar-bg z-40">

  <!-- Brand -->
  <div class="flex items-center gap-3 px-5 pt-6 pb-4">
    <div class="relative w-8 h-8 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full bg-pulse/12 animate-breathe"></div>
      <div class="w-3 h-3 rounded-full bg-pulse/80"></div>
    </div>
    <span class="text-sm font-semibold tracking-wider" style="color: #2c2418;">ALTER</span>
  </div>

  <!-- Nav Links -->
  <nav class="flex-1 px-3 mt-2 space-y-1">
    <a href="/" class="group relative flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200
      {% if page == 'today' %}nav-sidebar-active{% else %}text-stone-400 hover:text-stone-700 hover:bg-stone-100/50{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
      </svg>
      <span class="text-sm font-medium">Today</span>
      <template x-if="$store.alter.pendingCount > 0">
        <span class="ml-auto text-[10px] px-1.5 py-0.5 rounded-full bg-pulse/15 text-pulse"
          x-text="$store.alter.pendingCount"></span>
      </template>
    </a>

    <a href="/dashboard" class="group relative flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200
      {% if page == 'dashboard' %}nav-sidebar-active{% else %}text-stone-400 hover:text-stone-700 hover:bg-stone-100/50{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
      </svg>
      <span class="text-sm font-medium">Dashboard</span>
    </a>

    <a href="/me" class="group relative flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200
      {% if page == 'me' %}nav-sidebar-active{% else %}text-stone-400 hover:text-stone-700 hover:bg-stone-100/50{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
      </svg>
      <span class="text-sm font-medium">Me</span>
    </a>

    <a href="/goals" class="group relative flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200
      {% if page == 'goals' %}nav-sidebar-active{% else %}text-stone-400 hover:text-stone-700 hover:bg-stone-100/50{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/>
      </svg>
      <span class="text-sm font-medium">Goals</span>
    </a>

    <a href="/settings" class="group relative flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200
      {% if page == 'settings' %}nav-sidebar-active{% else %}text-stone-400 hover:text-stone-700 hover:bg-stone-100/50{% endif %}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="text-sm font-medium">Settings</span>
    </a>
  </nav>

  <!-- Ask ALTER (bottom of sidebar) -->
  <div class="px-4 pb-6 space-y-2" x-data="{ question: '', asking: false }"
    @alter:thinking.document="asking = $event.detail.on">
    <div class="flex items-center gap-2">
      <div class="relative w-8 h-8 flex-shrink-0 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full animate-breathe pointer-events-none"
          :class="$store.alter.pendingCount > 0 ? 'bg-pulse/18' : 'bg-pulse/12'"
          :style="$store.alter.pendingCount > 0 ? 'animation-duration: 1.5s;' : ''"></div>
        <div class="relative w-3 h-3 rounded-full pointer-events-none"
          :class="$store.alter.pendingCount > 0 ? 'bg-pulse' : 'bg-pulse/80'"
          style="animation: breathe 3s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
        <div id="orb-spinner" class="absolute inset-0 rounded-full border-2 border-pulse/25 border-t-transparent animate-spin-slow hidden pointer-events-none"></div>
      </div>
      <input type="text" x-model="question"
        @keydown.enter="if(question.trim()) { askAlter(question); question=''; }"
        placeholder="Ask ALTER..."
        class="flex-1 bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-1.5 text-xs"
        style="color: #5a4d3c;"
        :disabled="asking">
    </div>
    <button @click="if(!question.trim()) { triggerObserve(); } else { askAlter(question); question=''; }"
      class="w-full text-[10px] text-center transition-all py-1"
      style="color: #a69880;"
      :style="question.trim() ? 'color: #c07830;' : ''"
      x-text="question.trim() ? 'Ask' : 'Quick Scan'">
    </button>
  </div>

</aside>
