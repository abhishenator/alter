{% if goals %}
<details class="group">
  <summary class="flex items-center justify-between cursor-pointer px-1 py-2"
    style="color: rgba(255,255,255,0.25);">
    <div class="flex items-center gap-2">
      <svg class="w-3 h-3 transition-transform group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
      <span class="text-xs tracking-wider uppercase">Active Goals ({{ goals | length }})</span>
    </div>
    <a href="/goals" class="text-[10px] text-pulse/60 hover:text-pulse transition-all">See all</a>
  </summary>
  <div class="mt-1 space-y-1">
    {% for goal in goals[:6] %}
    <div class="glass-sm px-4 py-2 flex items-center gap-2">
      <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 flex-shrink-0"
        style="color: rgba(255,255,255,0.25);">{{ goal.time_horizon }}</span>
      <p class="text-xs flex-1" style="color: rgba(255,255,255,0.55);">{{ goal.description }}</p>
      <span class="text-[10px] flex-shrink-0" style="color: rgba(255,255,255,0.18);">{{ goal.domain }}</span>
    </div>
    {% endfor %}
  </div>
</details>
{% else %}
<div class="px-1 py-2">
  <a href="/goals" class="text-xs text-pulse/60 hover:text-pulse transition-all">+ Set your first goal</a>
</div>
{% endif %}
