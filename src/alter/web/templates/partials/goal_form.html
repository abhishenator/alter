<form hx-post="/api/v1/users/{{ user_id }}/goals"
      hx-target="#goal-list"
      hx-swap="innerHTML"
      hx-headers='{"Content-Type": "application/json"}'
      class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 space-y-4">
    <h3 class="font-semibold text-gray-900">Add New Goal</h3>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <input type="text" name="description" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
               placeholder="What do you want to achieve?">
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Domain</label>
            <select name="domain"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                <option value="health">Health & Wellness</option>
                <option value="wealth">Wealth & Career</option>
                <option value="relationships">Relationships</option>
                <option value="emotions">Emotional Well-being</option>
                <option value="growth" selected>Personal Growth</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Time Horizon</label>
            <select name="time_horizon"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="quarter" selected>Quarter</option>
                <option value="1_year">1 Year</option>
                <option value="5_year">5 Years</option>
                <option value="life">Lifetime</option>
            </select>
        </div>
    </div>
    <button type="submit"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors">
        Add Goal
    </button>
</form>
