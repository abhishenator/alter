{% if narrative %}
<div class="glass p-6 halo animate-fade-in">
  <p class="text-sm leading-relaxed" style="color: rgba(255,255,255,0.80);">{{ narrative }}</p>
</div>
{% else %}
<div class="glass p-6 halo">
  <p class="text-sm italic" style="color: rgba(255,255,255,0.30);">
    No narrative yet. ALTER is still forming its understanding of you.
  </p>
  <p class="text-xs mt-2" style="color: rgba(255,255,255,0.20);">
    Check in daily and trigger observations to help ALTER build your story.
  </p>
</div>
{% endif %}
