<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Active Goals</p>
        <p class="mt-1 text-3xl font-bold text-gray-900">{{ status.active_goals_count }}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Total Goals</p>
        <p class="mt-1 text-3xl font-bold text-gray-900">{{ status.total_goals }}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Cycles Completed</p>
        <p class="mt-1 text-3xl font-bold text-gray-900">{{ status.cycle_count }}</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-sm text-gray-500">Last Cycle</p>
        <p class="mt-1 text-lg font-bold text-gray-900">
            {% if status.last_execution %}
                {{ status.last_execution[:10] }}
            {% else %}
                Never
            {% endif %}
        </p>
    </div>
</div>
