<nav class="fixed bottom-4 left-4 right-4 sm:left-1/2 sm:right-auto sm:-translate-x-1/2 sm:bottom-6 z-50 md:hidden">
  <div class="glass flex items-center justify-center gap-1 px-2 py-2 mx-auto w-fit">

    <!-- Today -->
    <a href="/" class="group relative flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl transition-all duration-300
      {% if page == 'today' %}nav-active{% else %}text-stone-400 hover:text-stone-600 hover:bg-stone-100/60{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
      </svg>
      <template x-if="$store.alter.pendingCount > 0">
        <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-pulse animate-breathe" style="animation-duration: 1.5s;"></span>
      </template>
    </a>

    <!-- Dashboard -->
    <a href="/dashboard" class="group relative flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl transition-all duration-300
      {% if page == 'dashboard' %}nav-active{% else %}text-stone-400 hover:text-stone-600 hover:bg-stone-100/60{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
      </svg>
    </a>

    <!-- Center Pulse Orb (Ask) -->
    <div class="group relative mx-1" x-data="{ showAsk: false }">
      <button @click="showAsk = !showAsk" data-orb-spinner
        class="relative flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full
               bg-pulse/18 border border-pulse/30 hover:bg-pulse/30 hover:border-pulse/50
               transition-all duration-300">
        <div class="absolute inset-0 rounded-full animate-breathe pointer-events-none"
          :class="$store.alter.pendingCount > 0 ? 'bg-pulse/18' : 'bg-pulse/15'"
          :style="$store.alter.pendingCount > 0 ? 'animation-duration: 1.5s;' : ''"></div>
        <div class="relative w-4 h-4 rounded-full bg-pulse/80 pointer-events-none" style="animation: breathe 3s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
        <div data-orb-spinner-ring class="absolute inset-0 rounded-full border-2 border-pulse/30 border-t-transparent animate-spin-slow hidden pointer-events-none"></div>
      </button>

      <!-- Mobile ask modal -->
      <div x-show="showAsk" x-cloak x-transition
        class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 w-72 glass p-4 rounded-xl space-y-2">
        <input type="text" id="mobile-ask-input"
          placeholder="Ask ALTER something..."
          class="w-full bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-2 text-sm"
          style="color: #3d3225;"
          @keydown.enter="const q=document.getElementById('mobile-ask-input').value; if(q.trim()){askAlter(q); showAsk=false; document.getElementById('mobile-ask-input').value='';} else {triggerObserve(); showAsk=false;}">
        <div class="flex gap-2">
          <button @click="triggerObserve(); showAsk=false"
            class="flex-1 px-3 py-1.5 rounded-lg text-xs bg-stone-100/60 border border-stone-200/50 hover:bg-stone-200/50"
            style="color: #8a7b68;">Quick Scan</button>
          <button @click="const q=document.getElementById('mobile-ask-input').value; if(q.trim()){askAlter(q); showAsk=false; document.getElementById('mobile-ask-input').value='';}"
            class="flex-1 px-3 py-1.5 rounded-lg text-xs bg-pulse/15 border border-pulse/25 text-pulse hover:bg-pulse/18">Ask</button>
        </div>
      </div>
    </div>

    <!-- Me -->
    <a href="/me" class="group relative flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl transition-all duration-300
      {% if page == 'me' %}nav-active{% else %}text-stone-400 hover:text-stone-600 hover:bg-stone-100/60{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
      </svg>
    </a>

    <!-- Goals -->
    <a href="/goals" class="group relative flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl transition-all duration-300
      {% if page == 'goals' %}nav-active{% else %}text-stone-400 hover:text-stone-600 hover:bg-stone-100/60{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/>
      </svg>
    </a>

    <!-- Settings -->
    <a href="/settings" class="group relative flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl transition-all duration-300
      {% if page == 'settings' %}nav-active{% else %}text-stone-400 hover:text-stone-600 hover:bg-stone-100/60{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </a>

  </div>
</nav>
