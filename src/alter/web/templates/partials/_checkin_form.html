{# Check-in form — included by today.html in both compact and full modes #}
<div class="space-y-4">
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs">
    <label class="space-y-1">
      <div class="flex justify-between">
        <span style="color: #7a6c58;">Mood</span>
        <span class="text-pulse" x-text="mood"></span>
      </div>
      <input type="range" min="1" max="10" x-model="mood" class="w-full accent-purple-400">
    </label>
    <label class="space-y-1">
      <div class="flex justify-between">
        <span style="color: #7a6c58;">Energy</span>
        <span class="text-pulse" x-text="energy"></span>
      </div>
      <input type="range" min="1" max="10" x-model="energy" class="w-full accent-purple-400">
    </label>
    <label class="space-y-1">
      <div class="flex justify-between">
        <span style="color: #7a6c58;">Stress</span>
        <span class="text-pulse" x-text="stress"></span>
      </div>
      <input type="range" min="1" max="10" x-model="stress" class="w-full accent-purple-400">
    </label>
    <label class="space-y-1">
      <div class="flex justify-between">
        <span style="color: #7a6c58;">Sleep (hours)</span>
        <span class="text-pulse" x-text="sleep"></span>
      </div>
      <input type="number" x-model="sleep" step="0.5" min="0" max="14"
        class="w-full bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-1.5 text-sm">
    </label>
    <label class="space-y-1">
      <div class="flex justify-between">
        <span style="color: #7a6c58;">Exercise (min)</span>
        <span class="text-pulse" x-text="exercise"></span>
      </div>
      <input type="number" x-model="exercise" step="5" min="0" max="300"
        class="w-full bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-1.5 text-sm">
    </label>
  </div>

  {# What's on your mind? #}
  <div>
    <textarea x-model="note" rows="2"
      class="w-full bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-2 text-sm resize-none"
      placeholder="What's on your mind? (optional)"
      style="color: #3d3225;"></textarea>
  </div>

  <button @click="submit()" :disabled="saving"
    class="w-full md:w-auto px-6 py-2 rounded-xl text-sm font-medium transition-all
           bg-pulse/15 border border-pulse/25 text-pulse hover:bg-pulse/18
           disabled:opacity-30 disabled:cursor-not-allowed">
    <span x-show="!saving && !saved">Log Check-in</span>
    <span x-show="saving" x-cloak>...</span>
    <span x-show="saved" x-cloak class="text-emerald-400">Logged</span>
  </button>
</div>
