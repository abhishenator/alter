<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ALTER{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/tailwind.css">

  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script>
    // Re-initialize Alpine components after HTMX swaps in new HTML
    document.addEventListener('htmx:afterSettle', function(evt) {
      if (evt.detail.elt && typeof Alpine !== 'undefined') {
        Alpine.initTree(evt.detail.elt);
      }
    });
  </script>

  <style>[x-cloak] { display: none !important; }</style>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body class="h-full alter-bg font-sans antialiased" style="color: #2c2418;">

  <!-- Desktop sidebar nav -->
  {% include "partials/nav.html" %}

  <!-- Main content area -->
  <main class="min-h-screen md:ml-56 lg:ml-64 pb-28 md:pb-8">
    <div class="px-4 pt-8 md:px-6 lg:px-8 max-w-6xl mx-auto">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Mobile bottom nav -->
  {% include "partials/nav_mobile.html" %}

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-6 right-6 z-50 space-y-3 max-w-sm"></div>

  <!-- Processing overlay (shown during reviews) -->
  <div id="processing-overlay" class="fixed inset-0 z-[60] hidden cursor-pointer"
       onclick="hideProcessingOverlay()"
       style="background: rgba(250, 248, 245, 0.92); backdrop-filter: blur(8px); transition: opacity 0.3s ease;">
    <div class="flex flex-col items-center justify-center h-full animate-fade-in">
      <div class="relative w-24 h-24 mb-8">
        <div class="absolute inset-0 rounded-full bg-pulse/12 animate-breathe"></div>
        <div class="absolute inset-4 rounded-full bg-pulse/18 animate-breathe" style="animation-delay: 0.5s;"></div>
        <div class="absolute inset-8 rounded-full bg-pulse/30" style="animation: breathe 2s ease-in-out infinite;"></div>
        <div class="absolute inset-0 rounded-full border-2 border-pulse/15 border-t-pulse/50 animate-spin-slow"></div>
      </div>
      <p id="processing-title" class="text-base font-medium mb-2" style="color: #2c2418;">Reviewing your day...</p>
      <p id="processing-detail" class="text-sm" style="color: #8a7b68;">This usually takes 10-20 seconds</p>
      <div class="flex gap-1.5 mt-6">
        <div class="w-1.5 h-1.5 rounded-full bg-pulse/40 animate-breathe"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-pulse/40 animate-breathe" style="animation-delay: 0.3s;"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-pulse/40 animate-breathe" style="animation-delay: 0.6s;"></div>
      </div>
    </div>
  </div>

  <script>
    const USER_ID = '{{ user_id | default("default", true) }}';

    document.addEventListener('alpine:init', () => {
      Alpine.store('alter', {
        userId: USER_ID,
        consciousnessActive: false,
        notifications: [],
        narrative: '',
        pendingCount: 0,

        async refreshStatus() {
          try {
            const res = await fetch('/api/v1/consciousness/status');
            if (res.ok) {
              const data = await res.json();
              this.consciousnessActive = data.running || false;
              this.narrative = data.narrative || '';
              this.pendingCount = data.pending_inbox_count || data.inbox_pending || 0;
            }
          } catch(e) {}
        },

        async refreshNotifications() {
          try {
            const res = await fetch('/api/v1/consciousness/notifications');
            if (res.ok) {
              const data = await res.json();
              this.notifications = data.notifications || [];
            }
          } catch(e) {}
        }
      });

      Alpine.store('alter').refreshStatus();
      Alpine.store('alter').refreshNotifications();
      setInterval(() => {
        Alpine.store('alter').refreshStatus();
        Alpine.store('alter').refreshNotifications();
      }, 120000);
    });
  </script>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
