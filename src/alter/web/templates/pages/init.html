<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTER - Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center" x-data="setupWizard()">
    <div class="max-w-lg w-full mx-4">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">ALTER</h1>
            <p class="mt-2 text-gray-500">Adaptive Life Transformation & Evolution Runtime</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">
            <!-- Step 1: User ID -->
            <div x-show="step === 1" x-transition>
                <h2 class="text-xl font-semibold text-gray-900 mb-2">Welcome</h2>
                <p class="text-sm text-gray-500 mb-6">Let's set up your ALTER system. First, choose an identifier.</p>

                <label class="block text-sm font-medium text-gray-700 mb-2">User ID</label>
                <input type="text" x-model="userId"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                       placeholder="e.g., your name">

                <button @click="step = 2" :disabled="!userId"
                        class="mt-6 w-full py-2.5 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    Continue
                </button>
            </div>

            <!-- Step 2: Purpose -->
            <div x-show="step === 2" x-transition x-cloak>
                <h2 class="text-xl font-semibold text-gray-900 mb-2">Your Life Purpose</h2>
                <p class="text-sm text-gray-500 mb-6">What drives you? This can evolve over time.</p>

                <label class="block text-sm font-medium text-gray-700 mb-2">Purpose Statement</label>
                <textarea x-model="purpose" rows="3"
                          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                          placeholder="e.g., Build products that help people live better lives"></textarea>

                <div class="flex gap-3 mt-6">
                    <button @click="step = 1"
                            class="flex-1 py-2.5 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-colors">
                        Back
                    </button>
                    <button @click="submit()" :disabled="loading"
                            class="flex-1 py-2.5 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50 transition-colors">
                        <span x-show="!loading">Create Profile</span>
                        <span x-show="loading">Setting up...</span>
                    </button>
                </div>
            </div>

            <!-- Step 3: Success -->
            <div x-show="step === 3" x-transition x-cloak>
                <div class="text-center py-4">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <h2 class="text-xl font-semibold text-gray-900 mb-2">You're All Set!</h2>
                    <p class="text-sm text-gray-500 mb-6">ALTER is ready to help you optimize your life.</p>
                    <a href="/"
                       class="inline-block px-8 py-2.5 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors">
                        Go to Dashboard
                    </a>
                </div>
            </div>

            <!-- Error -->
            <div x-show="error" class="mt-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm" x-text="error"></div>
        </div>
    </div>

    <script>
    function setupWizard() {
        return {
            step: 1,
            userId: '',
            purpose: '',
            loading: false,
            error: '',

            async submit() {
                this.loading = true;
                this.error = '';

                try {
                    const response = await fetch('/api/v1/users/init', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: this.userId,
                            purpose: this.purpose || null
                        })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.detail || 'Failed to create user');
                    }

                    // Set cookie
                    document.cookie = `alter_user_id=${this.userId};path=/;max-age=31536000`;
                    this.step = 3;
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            }
        };
    }
    </script>
</body>
</html>
