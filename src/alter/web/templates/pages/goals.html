{% extends "base.html" %}
{% block title %}LifeOS — Goals{% endblock %}

{% block content %}
<div class="animate-fade-in space-y-5">

  <!-- Header + Purpose (full width) -->
  <div class="space-y-2">
    <h1 class="text-lg font-semibold">Goals</h1>
    <div x-data="purposeEditor('{{ status.get('purpose', '') | e }}')" class="glass-sm p-4">
      <div x-show="!editing" class="flex items-center justify-between">
        <p class="text-sm" style="color: #5a4d3c;"
          x-text="purpose || 'Set your north star...'"></p>
        <button @click="editing = true" class="text-[10px] hover:text-stone-400 transition-all"
          style="color: #a69880;">edit</button>
      </div>
      <div x-show="editing" x-cloak class="space-y-2">
        <textarea x-model="purpose" rows="2" class="w-full text-sm resize-none bg-transparent"
          placeholder="What is your purpose?"></textarea>
        <div class="flex gap-2">
          <button @click="save()" :disabled="saving"
            class="px-3 py-1 rounded text-xs bg-pulse/15 border border-pulse/25 text-pulse">Save</button>
          <button @click="editing = false" class="px-3 py-1 rounded text-xs"
            style="color: #8a7b68;">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 2-Column Grid: Graph (2/3) | Sidebar (1/3) -->
  <div class="md:grid md:grid-cols-5 lg:grid-cols-3 md:gap-5">

    <!-- Left: Goal Graph -->
    <div class="md:col-span-3 lg:col-span-2 md:max-h-[calc(100vh-12rem)] md:overflow-y-auto dashboard-scroll space-y-5">
      <div id="goal-tree"
        hx-get="/partials/goal-graph" hx-trigger="load, refresh"
        hx-swap="innerHTML transition:true">
        <div class="glass p-6 text-center">
          <p class="text-xs" style="color: #a69880;">Loading goals...</p>
        </div>
      </div>
    </div>

    <!-- Right: Vitals + Add Goal + Reviews + Completed -->
    <div class="md:col-span-2 lg:col-span-1 md:sticky md:top-6 space-y-5 mt-5 md:mt-0 self-start">

      <!-- Vitals Sparklines (7-day) -->
      <div hx-get="/partials/vitals" hx-trigger="load" hx-swap="innerHTML transition:true"></div>

      <!-- Add Goal Form -->
      <section x-data="goalForm()" class="glass p-5">
        <h3 class="text-xs font-semibold tracking-widest uppercase mb-3" style="color: #8a7b68;">Add Goal</h3>
        <div class="space-y-3">
          <input type="text" x-model="description" placeholder="What do you want to achieve?"
            class="w-full bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-2 text-sm">
          <div class="flex flex-col gap-2">
            <select x-model="domain"
              class="bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-1.5 text-xs">
              <option value="health">Health</option>
              <option value="career">Career</option>
              <option value="wealth">Wealth</option>
              <option value="relationships">Relationships</option>
              <option value="growth">Growth</option>
              <option value="emotions">Emotions</option>
            </select>
            <select x-model="horizon"
              class="bg-stone-100/60 border border-stone-200/50 rounded-lg px-3 py-1.5 text-xs">
              <option value="week">Week</option>
              <option value="month">Month</option>
              <option value="quarter">Quarter</option>
              <option value="1_year">Year</option>
              <option value="life">Life</option>
            </select>
            <button @click="submit()" :disabled="saving || !description.trim()"
              class="w-full px-4 py-1.5 rounded-lg text-xs font-medium transition-all
                     bg-pulse/15 border border-pulse/25 text-pulse hover:bg-pulse/18
                     disabled:opacity-30 disabled:cursor-not-allowed">
              Add
            </button>
          </div>
        </div>
      </section>

      <!-- Goal Analyses -->
      <details class="group">
        <summary class="flex items-center gap-2 cursor-pointer px-1 py-2"
          style="color: #a69880;">
          <svg class="w-3 h-3 transition-transform group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
          <span class="text-xs tracking-wider uppercase">Review Notes</span>
        </summary>
        <div class="mt-2"
          hx-get="/partials/goal-analyses" hx-trigger="revealed"
          hx-swap="innerHTML transition:true">
          <p class="text-xs p-4" style="color: #a69880;">Loading...</p>
        </div>
      </details>

      <!-- Completed Goals -->
      <details class="group">
        <summary class="flex items-center gap-2 cursor-pointer px-1 py-2"
          style="color: #a69880;">
          <svg class="w-3 h-3 transition-transform group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
          <span class="text-xs tracking-wider uppercase">Completed Goals</span>
        </summary>
        <div class="mt-2"
          hx-get="/partials/completed-goals" hx-trigger="revealed"
          hx-swap="innerHTML transition:true">
          <p class="text-xs p-4" style="color: #a69880;">Loading...</p>
        </div>
      </details>

    </div>
  </div>

</div>
{% endblock %}
